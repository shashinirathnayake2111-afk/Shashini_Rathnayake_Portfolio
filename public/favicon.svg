<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark luxury backdrop gradient with subtle warm coffee undertones -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1815" />
      <stop offset="50%" stop-color="#141110" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Royal Champagne Gold gradient for SR typography -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2da" />
      <stop offset="35%" stop-color="#E6C9A8" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#b48332" />
    </linearGradient>

    <!-- Elegant gold rim border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C9A8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E6C9A8" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base without Gold Rim Border -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Monogram Group (SR.) centered optically -->
  <g filter="url(#glow)">
    <text
      x="27"
      y="42"
      font-family="'Poppins', 'Cinzel', 'Chakra Petch', 'Segoe UI', -apple-system, sans-serif"
      font-size="26"
      font-weight="800"
      letter-spacing="1"
      fill="url(#goldGrad)"
      text-anchor="middle"
    >SR</text>

    <!-- Signature Brand Dot (matches Shashini Rathnayake. nav logo) -->
    <circle cx="47" cy="39" r="2.8" fill="#E6C9A8" />
  </g>
</svg>
